      el.appendChild(h('div', { class: cls, text: l }));
    }
    el.scrollTop = el.scrollHeight;
  }
  function setStatus(txt) {
    if (s.run) s.run.status = txt;
    const el = document.getElementById('status-text');
    if (el) el.textContent = txt;
  }

  async function generate() {
    if (s.run && s.run.running) return;
    const demande = s.demande.trim();
    if (!demande) { s.notice = { kind: 'err', text: T('need_text') }; render(); focusId('demande'); return; }
    if (!curKey()) { s.notice = { kind: 'err', text: T('need_key') }; s.setupOpen = true; render(); focusId('apikey'); return; }
    const controller = new AbortController();
    s.run = { running: true, status: T('st_wait'), log: [], error: null, controller };
    s.res = null; s.notice = null;
    render();
    const cfg = {
      provider: s.provider, apiKey: curKey(), model: curModel(), webSearch: !!s.web && s.provider !== 'openrouter',
      maxRetries: 2, pickup: s.pickup, lang: s.lang, maxTokens: 16000,
    };
    let attempts = 0;
    const ctx = {
      signal: controller.signal, timeout: 240000,
      log: (kind, a, b) => {
        if (kind === 'tokens') logLine(T('l_tokens', a, b));
        else if (kind === 'truncated') logLine(T('l_trunc'));
        else if (kind === 'model_switch') logLine(T('l_switch', a));
        else if (kind === 'http') logLine(T('l_http', a, b));
      },
    };
    const hooks = {
      template, signal: controller.signal, now: new Date(),
      callApi: (c, system, msgs) => G.callApi(c, system, msgs, ctx),
      log: logLine,
      t: (k, ...a) => {
        if (k === 'log_api_attempt') { attempts = a[0]; setStatus(a[0] > 1 ? T('st_fix') : T('st_wait')); return T('l_attempt', a[0]); }
        if (k === 'err_gen_failed') return 'err_gen_failed:' + a[0];
        const map = { log_light_catalog: 'l_light', log_json_cut: 'l_cut', log_unreadable: 'l_unreadable', log_style_ignored: 'l_style',
          log_errors_fix: 'l_fix', log_section: 'l_section', log_checksum_bad: 'l_checksum', log_warn: 'l_warn', log_written: 'l_written', log_variant_skip: 'l_skip' };
        return T(map[k] || k, ...a);
      },
    };
    let res = null;
    try {
      res = await G.generate(cfg, tb, demande, B.prompts, hooks, s.roles.length ? s.roles.slice() : null);
      if (!res.files.length) throw new Error('err_gen_failed:' + (cfg.maxRetries + 1));
    } catch (e) {
      s.run.error = friendly(e);
      logLine('  ! ' + String((e && e.message) || e));
    }
    s.run.running = false;
    if (res && res.files.length) {
      s.res = res; s.sel = { si: 0, vi: 0, slot: 'AMP' }; s.fresh = true;
    }
    render();
    if (s.res) { const r = document.getElementById('rack-panel'); if (r && r.scrollIntoView) r.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  }

  function focusId(id) { setTimeout(() => { const e = document.getElementById(id); if (e) e.focus(); }, 0); }

  // ---------------------------------------------------------------- telechargement
  function download(name, bytes, type) {
    const blob = new Blob([bytes], { type: type || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: url, download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  function downloadAll() {
    const enc = new TextEncoder(), entries = [], root = s.res.folder;
    for (const f of s.res.files) {
      const base = root + '/' + (f.folder ? f.folder + '/' : '') + f.filename.replace(/\.prst$/, '');
      entries.push({ name: base + '.prst', data: f.raw });
      entries.push({ name: base + '.json', data: enc.encode(JSON.stringify(f.spec, null, 1)) });
    }
    download(root + '.zip', G.buildZip(entries, new Date()), 'application/zip');
  }

  // ---------------------------------------------------------------- OpenRouter
  async function orLogin() {
    try {
      const p = await G.makePkce();
      try { sessionStorage.setItem(PKCE_KEY, p.verifier); } catch (e) { localStorage.setItem(PKCE_KEY, p.verifier); }
      location.href = G.openrouterAuthUrl(location.origin + location.pathname, p.challenge);
    } catch (e) { s.notice = { kind: 'err', text: T('or_ko', e.message) }; render(); }
  }
  async function orCallback() {
    const q = new URLSearchParams(location.search), code = q.get('code');
    if (!code) return;
    let verifier = null;
    try { verifier = sessionStorage.getItem(PKCE_KEY) || localStorage.getItem(PKCE_KEY); } catch (e) { /* rien */ }
    history.replaceState(null, '', location.pathname);
    if (!verifier) return;
    s.provider = 'openrouter'; s.setupOpen = true;
    s.notice = { kind: 'ok', text: T('or_wait') }; render();
    try {
      s.keys.openrouter = await G.openrouterExchange(code, verifier);
      s.notice = { kind: 'ok', text: T('or_ok') }; s.setupOpen = false; save();
    } catch (e) { s.notice = { kind: 'err', text: T('or_ko', friendly(e)) }; }
    try { sessionStorage.removeItem(PKCE_KEY); localStorage.removeItem(PKCE_KEY); } catch (e) { /* rien */ }
    render();
  }

  async function refreshModels() {
    s.modelMsg = T('refreshing'); paintModelMsg();
    const fallback = provInfo(s.provider).models;
    const list = await G.listModels({ provider: s.provider, apiKey: curKey(), maxTokens: 16000 }, fallback, { timeout: 20000 });
    const ok = list !== fallback && list.length;
    s.modelList[s.provider] = ok ? list : fallback;
    s.modelMsg = ok ? T('models_ok', list.length) : T('models_ko');
    render();
  }
  function paintModelMsg() { const e = document.getElementById('model-msg'); if (e) e.textContent = s.modelMsg; }

  // ------------------------------------------------------------------ rendu
  function render() {
    const app = document.getElementById('app');
    const keep = { y: window.scrollY };
    document.documentElement.lang = s.lang;
    app.textContent = '';
    app.appendChild(h('div', { class: 'wrap' }, header(), noticeBar(), setupPanel(), describePanel(), rackPanel(), footer()));
    window.scrollTo(0, keep.y);
    const lb = document.getElementById('logbox'); if (lb) paintLog(lb);
  }

  function header() {
    return h('div', { class: 'top' },
      h('div', { class: 'brand' }, svgLogo(), h('h1', null, 'GP-200 Studio Web', h('small', { text: T('tagline') }))),
      h('div', { class: 'seg', role: 'group', 'aria-label': 'Langue / Language' },
        ['fr', 'en'].map(l => h('button', { type: 'button', 'aria-pressed': String(s.lang === l), onclick: () => { s.lang = l; save(); render(); } }, l.toUpperCase()))));
  }

  function noticeBar() {
    return s.notice ? h('p', { class: 'note ' + (s.notice.kind === 'err' ? 'err' : 'ok'), role: s.notice.kind === 'err' ? 'alert' : 'status', text: s.notice.text }) : h('span');
  }

  function setupPanel() {
    const hasKey = !!curKey();
    const open = s.setupOpen === null ? !hasKey : s.setupOpen;
    const p = s.provider, info = provInfo(p);
    const panel = h('section', { class: 'panel' + (open ? '' : ' collapsed'), 'aria-labelledby': 'h-setup' });
    panel.appendChild(h('header', null,
      h('span', { class: 'num' + (hasKey ? ' done' : '') }, hasKey ? '✓' : '1'),
      h('h2', { id: 'h-setup', text: hasKey ? T('s1_done') : T('s1') }),
      hasKey && !open ? h('div', { class: 'summary' }, h('b', { text: PROV_NAME[p] + ' · ' + curModel() }),
        h('button', { type: 'button', class: 'btn small', onclick: () => { s.setupOpen = true; render(); } }, T('change'))) : null));

    const list = s.modelList[p] || info.models;
    const models = list.indexOf(curModel()) >= 0 ? list : [curModel()].concat(list);
    const keyInput = h('input', { id: 'apikey', type: 'password', autocomplete: 'off', spellcheck: 'false', value: s.keys[p] || '', 'aria-label': T('key'),
      oninput: e => { s.keys[p] = e.target.value.trim(); save(); checkKeyHint(); } });
    const toggle = h('button', { type: 'button', class: 'btn small ghost', onclick: e => {
      const hide = keyInput.type === 'password'; keyInput.type = hide ? 'text' : 'password'; e.target.textContent = hide ? T('hide') : T('show'); } }, T('show'));
    const hint = h('p', { class: 'note', id: 'key-hint', hidden: true });
    function checkKeyHint() {
      const v = (s.keys[p] || '').trim(), pre = KEY_PREFIX[p];
      const bad = v.length > 8 && v.indexOf(pre) !== 0;
      hint.hidden = !bad; hint.textContent = bad ? T('key_hint_bad', PROV_NAME[p], pre) : '';
    }
    const steps = p === 'gemini'
      ? h('ol', null, D[s.lang].h_gemini.map((x, i) => h('li', null, i === 0
        ? [x[0], h('a', { href: info.keys_url, target: '_blank', rel: 'noopener noreferrer', text: 'Google AI Studio' }), x[1]] : x)))
      : h('p', { text: D[s.lang]['h_' + p] });
    const httpOk = /^https?:$/.test(location.protocol);

    panel.appendChild(h('div', { class: 'body' },
      h('div', { class: 'row' },
        h('label', { class: 'f' }, T('provider'), h('select', { id: 'provider', onchange: e => { s.provider = e.target.value; save(); render(); } },
          PROVIDERS.map(x => h('option', { value: x, selected: x === p }, T('p_' + x))))),
        h('label', { class: 'f' }, T('model'), h('select', { id: 'model', onchange: e => { s.models[p] = e.target.value; save(); } },
          models.map(m => h('option', { value: m, selected: m === curModel() }, m))))),
      h('div', { class: 'row', style: 'align-items:center' },
        h('button', { type: 'button', class: 'btn small ghost', style: 'flex:0 0 auto', onclick: refreshModels }, T('refresh')),
        h('span', { id: 'model-msg', class: 'help', text: s.modelMsg })),
      h('div', { class: 'help' }, steps),
      p === 'openrouter' ? h('div', { class: 'row', style: 'align-items:center' },
        h('button', { type: 'button', class: 'btn go', style: 'flex:0 0 auto;min-height:44px;font-size:16px', disabled: !httpOk, onclick: orLogin }, T('or_login')),
        !httpOk ? h('p', { class: 'note', text: T('or_https') }) : null) : null,
      h('div', { class: 'row', style: 'align-items:end' },
        h('label', { class: 'f' }, T('key'), h('div', { class: 'keybox' }, keyInput, toggle)),
        h('a', { class: 'btn', style: 'flex:0 0 auto', href: info.keys_url, target: '_blank', rel: 'noopener noreferrer' }, T('get_key'))),
      hint,
      h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: s.remember, onchange: e => { s.remember = e.target.checked; save(); } }), T('remember')),
      h('p', { class: 'help', text: T('privacy') }),
      hasKey ? h('div', null, h('button', { type: 'button', class: 'btn', onclick: () => { s.setupOpen = false; render(); } }, 'OK')) : null));
    setTimeout(checkKeyHint, 0);
    return panel;
  }

  function describePanel() {
    const running = !!(s.run && s.run.running);
    const webOk = s.provider !== 'openrouter';
    const roleBtns = G.ROLES.map(r => {
      const i = s.roles.indexOf(r);
      return h('button', { type: 'button', class: 'chip', 'aria-pressed': String(i >= 0), onclick: () => {
        if (i >= 0) s.roles.splice(i, 1); else if (s.roles.length < 4) s.roles.push(r);
        render(); } }, T('role_' + r), i >= 0 ? h('span', { class: 'order', text: ' ' + (i + 1) }) : null);
    });
    const ta = h('textarea', { id: 'demande', rows: '3', placeholder: T('sound_ph'), 'aria-label': T('s2'), disabled: running,
      oninput: e => { s.demande = e.target.value; } });
    ta.value = s.demande;
    return h('section', { class: 'panel', 'aria-labelledby': 'h-desc' },
      h('header', null, h('span', { class: 'num' }, '2'), h('div', null, h('h2', { id: 'h-desc', text: T('s2') }), h('p', { class: 'sub', text: T('s2_sub') }))),
      h('div', { class: 'body' },
        ta,
        h('div', { class: 'chips', role: 'group', 'aria-label': T('examples') },
          B.examples[s.lang].slice(0, 6).map(ex => h('button', { type: 'button', class: 'chip', disabled: running, onclick: () => { s.demande = ex; ta.value = ex; ta.focus(); } }, ex))),
        h('div', { class: 'row' },
          h('div', null, h('div', { class: 'f', style: 'font-size:14px;color:var(--ink-dim);margin-bottom:6px', text: T('structure') }),
            h('div', { class: 'roles' }, h('button', { type: 'button', class: 'chip', 'aria-pressed': String(!s.roles.length), onclick: () => { s.roles = []; render(); } }, T('auto')), roleBtns),
            h('p', { class: 'help', style: 'margin-top:6px', text: s.roles.length ? T('structure_forced', s.roles.map(r => T('role_' + r)).join(' → ')) : T('structure_auto') })),
          h('div', null,
            h('label', { class: 'f' }, T('pickup'), h('select', { id: 'pickup', onchange: e => { s.pickup = e.target.value; save(); } },
              ['auto', 'humbucker', 'single', 'p90', 'active'].map(k => h('option', { value: k, selected: s.pickup === k }, T('pk_' + k))))),
            h('label', { class: 'check', style: 'margin-top:10px' }, h('input', { type: 'checkbox', checked: s.web && webOk, disabled: !webOk, onchange: e => { s.web = e.target.checked; } }),
              T('web') + (webOk ? '' : ' ' + T('web_na'))))),
        h('div', { class: 'actions' },
          running ? h('button', { type: 'button', class: 'btn stop', onclick: () => { s.run.controller.abort(); setStatus(T('st_cancel')); } }, T('stop'))
                  : h('button', { type: 'button', class: 'btn go', id: 'go', onclick: generate }, T('go')),
          h('div', { class: 'status', role: 'status', 'aria-live': 'polite' },
            running ? h('span', { class: 'dot' }) : null,
            h('span', { id: 'status-text', text: running ? s.run.status : '' }))),
        s.run && s.run.error ? h('p', { class: 'note err', role: 'alert', text: s.run.error, style: 'white-space:pre-line' }) : null,
        s.run && s.run.log.length ? h('details', { class: 'more', open: !!s.run.error },
          h('summary', { text: T('log') }), h('div', { class: 'logbox', id: 'logbox', style: 'margin-top:8px' })) : null));
  }

  function slotName(slot) { return SLOT_NAMES[s.lang][slot]; }

  function rackPanel() {
    const running = !!(s.run && s.run.running);
    const res = s.res;
    const panel = h('section', { class: 'rack-wrap', id: 'rack-panel', 'aria-label': T('rack') });
    let groups = null, file = null, sec = null;
    if (res) {
      const secs = res.payload.sections || [];
      groups = secs.map(sc => res.files.filter(f => f.section === sc));
      if (s.sel.si >= groups.length || !groups[s.sel.si].length) s.sel.si = Math.max(0, groups.findIndex(g => g.length));
      sec = secs[s.sel.si];
      const gr = groups[s.sel.si] || [];
      if (s.sel.vi >= gr.length) s.sel.vi = 0;
      file = gr[s.sel.vi];
    }

    panel.appendChild(h('div', { class: 'rack-head' },
      h('h2', { text: res ? [res.payload.artiste, res.payload.titre].filter(x => x && String(x).trim()).join(' - ') || T('rack') : T('rack') }),
      res ? h('span', { class: 'meta', text: T('presets_ready', res.files.length) }) : null,
      res ? h('button', { type: 'button', class: 'btn', onclick: downloadAll }, T('download_all')) : null));

    if (res && groups.length > 1) {
      panel.appendChild(h('div', { class: 'tabs' }, groups.map((g, i) => h('button', { type: 'button', class: 'tab', 'aria-pressed': String(i === s.sel.si),
        onclick: () => { s.sel.si = i; s.sel.vi = 0; s.fresh = true; render(); } },
        (i + 1) + '. ' + (res.payload.sections[i].nom || '?'), res.payload.sections[i].role ? h('small', { text: ' ' + res.payload.sections[i].role }) : null))));
    }
    if (res && sec) {
      if (sec.raison) panel.appendChild(h('p', { class: 'why', text: sec.raison }));
      const gr = groups[s.sel.si];
      panel.appendChild(h('div', { class: 'tabs' }, gr.map((f, i) => h('button', { type: 'button', class: 'tab', 'aria-pressed': String(i === s.sel.vi),
        onclick: () => { s.sel.vi = i; s.fresh = true; render(); } }, f.variant.label || 'ABC'[i]))));
    }

    // ---- les 11 slots, dans l'ordre de la chaine
    const dec = file ? file.decoded : null;
    const order = dec && dec.chain_order ? dec.chain_order : G.MODULES.map((_, i) => i);
    const rack = h('ol', { class: 'rack' + (running ? ' scan' : '') + (s.fresh && res ? ' lit' : '') });
    order.forEach((mi, pos) => {
      const slot = G.MODULES[mi], e = dec ? dec.modules[slot] : null;
      const has = !!(e && e.model);
      const on = has && e.on;
      const li = h('li', { class: 'slot' + (on ? ' on' : '') + (has && !on ? ' off' : '') + (has ? '' : ' empty') + (dec ? ' fresh' : ''), 'data-fam': FAMILY[slot], style: '--i:' + pos },
        h('button', { type: 'button', disabled: !has, 'aria-pressed': String(has && s.sel.slot === slot),
          'aria-label': slotName(slot) + ' : ' + (has ? e.model + ' (' + (on ? T('active') : T('bypass')) + ')' : T('empty_slot')),
          onclick: () => { s.sel.slot = slot; s.fresh = false; render(); } },
          h('span', { class: 'led' }), h('span', { class: 'abbr', text: slot }), h('span', { class: 'kind', text: slotName(slot) }),
          h('span', { class: 'mname', text: has ? e.model : (running ? '' : '–') })));
      rack.appendChild(li);
    });
    panel.appendChild(rack);
    if (!res) panel.appendChild(h('p', { class: 'rack-empty', text: running ? T('rack_busy') : T('rack_empty') }));

    if (res && file) {
      panel.appendChild(h('div', { class: 'vhead' },
        h('span', { class: 'vname', text: file.spec.name || file.filename }),
        h('span', { class: 'vfile', text: file.filename }),
        h('button', { type: 'button', class: 'btn', onclick: () => download(file.filename, file.raw) }, T('download'))));
      const v = file.variant;
      if (v.axe || v.ecoute) panel.appendChild(h('dl', { class: 'kv' },
        v.axe ? [h('dt', { text: T('angle') }), h('dd', { text: v.axe })] : null,
        v.ecoute ? [h('dt', { text: T('listen') }), h('dd', { text: v.ecoute })] : null));
      if (file.warnings.length) panel.appendChild(h('ul', { class: 'warns' }, file.warnings.map(w => h('li', { text: w }))));
      panel.appendChild(inspector(file));
      const pl = res.payload;
      if (pl.recherche || pl.structure || pl.notes) {
        panel.appendChild(h('details', { class: 'more' }, h('summary', { text: T('rig') + ' · ' + T('structure_l') + ' · ' + T('notes') }),
          pl.recherche ? h('p', null, h('b', { text: T('rig') + ' : ' }), String(pl.recherche)) : null,
          pl.structure ? h('p', null, h('b', { text: T('structure_l') + ' : ' }), String(pl.structure)) : null,
          pl.notes ? h('p', null, h('b', { text: T('notes') + ' : ' }), String(pl.notes)) : null));
      }
      panel.appendChild(h('div', { class: 'dl' }, h('p', { class: 'hint', text: T('dl_hint') })));
    } else if (!res) {
      panel.appendChild(h('p', { class: 'rack-empty', text: '' }));
    }
    return panel;
  }

  function inspector(file) {
    const slot = file.decoded.modules[s.sel.slot] ? s.sel.slot : 'AMP';
    const e = file.decoded.modules[slot];
    const box = h('div', { class: 'insp' });
    if (!e || !e.model) { box.appendChild(h('p', { class: 'help', text: T('inspector_hint') })); return box; }
    const mid = e.model_id, cat = e.category;
    const d = cat === 10 ? '' : tb.description(mid, cat);
    box.appendChild(h('h3', { text: slotName(slot) + ' · ' + e.model + (e.on ? '' : ' (' + T('bypass') + ')') }));
    if (d) box.appendChild(h('p', { class: 'what', text: d }));
    const ul = h('ul', { class: 'params' });
    for (const p of tb.paramsOf(mid, cat)) {
      if (p.slot >= 15) continue;
      const val = e.params[p.name];
      if (val === undefined) continue;
      const lo = Math.min(p.min, p.max), hi = Math.max(p.min, p.max);
      const pct = hi > lo ? Math.max(0, Math.min(100, (val - lo) / (hi - lo) * 100)) : 0;
      ul.appendChild(h('li', null, h('span', { text: p.name }), h('span', { class: 'pv', text: G.fmtG(val, 4) }),
        h('span', { class: 'bar' }, h('i', { style: 'width:' + pct.toFixed(1) + '%' }))));
    }
    box.appendChild(ul);
    return box;
  }

  function footer() {
    return h('footer', { class: 'foot' }, h('p', { text: T('foot_a') }),
      h('p', null, T('foot_b') + ' ', h('a', { href: B.repo, target: '_blank', rel: 'noopener noreferrer', text: T('repo') })));
  }

  // ------------------------------------------------------------------ demarrage
  load();
  if (!PROVIDERS.every(p => B.providers[p])) throw new Error('providers manquants');
  render();
  orCallback();
  // pour les tests automatises uniquement
  self.__gp200 = { state: s, render };
})();
</script>
</body>
</html>
