    for (const key of Object.keys(ctrl)) {
      const n = parseInt(String(key).toUpperCase().replace('CTRL', '').trim(), 10);
      if (!(n >= 1 && n <= N_CTRL)) throw new ValueError('CTRL ' + pyRepr(key) + ' hors 1..' + N_CTRL);
      let mods = ctrl[key];
      if (typeof mods === 'string') mods = [mods];
      let mask = 0;
      for (const m0 of (mods || [])) {
        const m = String(m0).toUpperCase();
        if (!has(MODULE_INDEX, m)) throw new ValueError('Module ' + pyRepr(m) + ' inconnu (attendus: ' + pyRepr(MODULES) + ')');
        mask |= 1 << MODULE_INDEX[m];
      }
      const o = OFF_CTRL + (n - 1) * CTRL_REC_SIZE;
      if (data[o] !== 0x0f || data[o + 1] !== 0 || data[o + 2] !== 8 || data[o + 3] !== 0 || data[o + 4] !== n - 1) {
        throw new ValueError('Table CTRL inattendue a 0x' + o.toString(16));
      }
      dv.setUint32(o + 8, mask >>> 0, true);
    }
    return data;
  }

  function neutralizeAssignments(data) {
    for (let i = 0; i < 9; i++) data[0x3b8 + i * 16 + 5] = 0xFF;
    for (let i = 0; i < 3; i++) data[0x448 + i * 8 + 5] = 0xFF;
    return data;
  }

  function setU16BE(data, off, v) { data[off] = (v >> 8) & 0xFF; data[off + 1] = v & 0xFF; }
  function getU16BE(data, off) { return (data[off] << 8) | data[off + 1]; }

  // ------------------------------------------------------------------ encode
  /**
   * Construit un .prst valide a partir d'un spec. Meme contrat que
   * gp200lib.encode_prst. `template` = Uint8Array de 1224 octets.
   * Renvoie {raw: Uint8Array, warnings: [string]}.
   */
  function encodePrst(spec, tables, template, opts) {
    opts = opts || {};
    const keepAssignments = !!opts.keepAssignments;
    const strict = opts.strict !== false;
    const fillEmptySlots = opts.fillEmptySlots !== false;
    if (spec === null || typeof spec !== 'object' || Array.isArray(spec)) {
      throw new ValueError('spec invalide (objet attendu)');
    }

    const data = new Uint8Array(template);
    if (data.length !== FILE_SIZE) throw new ValueError('Template invalide (' + data.length + ' octets)');
    const dv = new DataView(data.buffer, data.byteOffset, data.byteLength);

    const name = spec.name === undefined ? 'Untitled' : spec.name;
    if (strict) {
      if (typeof name !== 'string') throw new ValueError('name doit etre une chaine');
      if (chars(name).length > LEN_NAME) {
        throw new ValueError('Nom trop long (' + chars(name).length + ' > ' + LEN_NAME + '): ' + pyRepr(name));
      }
    }
    putStr(data, OFF_NAME, LEN_NAME, name === null ? '' : name);
    putStr(data, OFF_AUTHOR, LEN_AUTHOR, spec.author == null ? '' : spec.author);
    putStr(data, OFF_DESCRIPTION, LEN_DESCRIPTION, spec.description == null ? '' : spec.description);

    const rec0 = findBytes(data, REC_MAGIC);
    if (rec0 < 12) throw new ValueError('Enregistrements de module introuvables');

    const chain = spec.chain_order === undefined ? MODULES.map((_, i) => i) : spec.chain_order;
    const sortedChain = Array.isArray(chain) ? chain.slice().sort((p, q) => p - q) : null;
    if (!sortedChain || sortedChain.length !== N_MODULES || !sortedChain.every((v, i) => v === i)) {
      throw new ValueError('chain_order doit etre une permutation de 0..10, recu ' + pyRepr(chain));
    }
    for (let i = 0; i < N_MODULES; i++) data[rec0 - 12 + i] = chain[i];
    data[rec0 - 1] = 0;

    const warnings = [];
    const modsIn = spec.modules == null ? {} : spec.modules;

    for (let k = 0; k < N_MODULES; k++) {
      const slot = MODULES[k];
      const o = rec0 + k * RECORD_SIZE;
      let ms = has(modsIn, slot) ? modsIn[slot] : undefined;

      if (fillEmptySlots && !(pyTruthy(ms) && pyTruthy(ms.model))) {
        ms = { model: SLOT_FALLBACK[slot], on: slot === 'VOL',
               params: slot === 'VOL' ? { Volume: 100.0 } : {} };
      }

      const hasMs = pyTruthy(ms);
      const onVal = hasMs ? (has(ms, 'on') ? ms.on : true) : false;
      dv.setUint16(o, 20, true);
      dv.setUint16(o + 2, 68, true);
      data[o + 4] = k;
      data[o + 5] = (hasMs && pyTruthy(onVal)) ? 1 : 0;
      dv.setUint16(o + 6, 15, true);

      const payload = new Uint8Array(PAYLOAD_SIZE);
      const pdv = new DataView(payload.buffer);
      if (hasMs && pyTruthy(ms.model)) {
        const found = tables.find(slot, ms.model);
        const m = found[0], cat = found[1];
        const mid = cat === 10 ? m.model_id : m.id;
        pdv.setUint16(0, mid, true);
        payload[2] = 0;
        payload[3] = cat;

        const plist = tables.paramsOf(mid, cat);
        const rawGiven = ms.params == null ? {} : ms.params;
        if (typeof rawGiven !== 'object' || Array.isArray(rawGiven)) {
          throw new ValueError('slot ' + slot + ' : params doit etre un objet');
        }
        const given = Object.entries(rawGiven);
        const known = new Map();
        for (const p of plist) known.set(norm(p.name), p);
        for (const g of given) {
          if (!known.has(norm(g[0]))) {
            const msg = slot + '/' + m.name + ' : parametre ' + pyRepr(g[0]) + ' inconnu (attendus: ' +
              pyRepr(plist.map(p => p.name)) + ')';
            if (strict) throw new ValueError(msg);
            warnings.push(msg);
          }
        }

        for (const p of plist) {
          let val;
          let explicit = false;
          for (const g of given) {
            if (norm(g[0]) === norm(p.name)) {
              val = pyFloat(g[1]);
              if (val === undefined) throw new ValueError('could not convert to float: ' + pyRepr(g[1]));
              explicit = true;
              break;
            }
          }
          if (val === undefined) val = Number(p.default);
          const lo = Math.min(p.min, p.max), hi = Math.max(p.min, p.max);
          if (!(lo <= val && val <= hi)) {
            // valeur EXPLICITE hors bornes : respectee (mode Sync = index de division).
            if (!explicit) {
              warnings.push(slot + '/' + m.name + '/' + p.name + ' : ' + fmtG(val) +
                ' hors [' + fmtG(lo) + '..' + fmtG(hi) + '], borne');
              val = Math.max(lo, Math.min(hi, val));
            }
          }
          if (p.slot < N_SLOTS) {
            if (Number.isFinite(val) && !Number.isFinite(Math.fround(val))) {
              throw new ValueError('float too large to pack with f format');
            }
            pdv.setFloat32(4 + 4 * p.slot, val, true);
          }
        }
      }
      data.set(payload, o + 8);
    }

    if (!keepAssignments) neutralizeAssignments(data);
    if (pyTruthy(spec.ctrl)) writeCtrl(data, spec.ctrl);

    setU16BE(data, data.length - 2, checksum(data));
    return { raw: data, warnings };
  }

  // ------------------------------------------------------------------ decode
  /** round(f, 4) de Python : toFixed arrondit les egalites vers le haut, Python vers le pair. */
  function round4(f) {
    const s = f * 10000;
    if (Number.isFinite(s) && Math.abs(s - Math.trunc(s)) === 0.5) {
      const lo = Math.floor(s);
      return (lo % 2 === 0 ? lo : lo + 1) / 10000;
    }
    return Number(f.toFixed(4));
  }
  /** Decode un .prst en objet lisible (meme contrat que gp200lib.decode_prst). */
  function decodePrst(data, tables) {
    if (data.length !== FILE_SIZE) throw new ValueError('Taille inattendue: ' + data.length + ' (attendu ' + FILE_SIZE + ')');
    const rec0 = findBytes(data, REC_MAGIC);
    if (rec0 < 12) throw new ValueError('Enregistrements de module introuvables');
    const dv = new DataView(data.buffer, data.byteOffset, data.byteLength);

    let chain = Array.from(data.slice(rec0 - 12, rec0 - 1));
    if (!chain.slice().sort((p, q) => p - q).every((v, i) => v === i)) chain = null;

    const out = {
      name: getStr(data, OFF_NAME, LEN_NAME),
      author: getStr(data, OFF_AUTHOR, LEN_AUTHOR),
      description: getStr(data, OFF_DESCRIPTION, LEN_DESCRIPTION),
      chain_order: chain,
      chain_readable: chain ? chain.map(i => MODULES[i]) : null,
      modules: {},
    };

    for (let k = 0; k < N_MODULES; k++) {
      const o = rec0 + k * RECORD_SIZE;
      const midx = data[o + 4], on = data[o + 5];
      const mid = dv.getUint16(o + 8, true), flags = data[o + 10], cat = data[o + 11];
      const floats = [];
      for (let i = 0; i < N_SLOTS; i++) floats.push(dv.getFloat32(o + 12 + 4 * i, true));
      const slot = midx < N_MODULES ? MODULES[midx] : '?' + midx;
      const entry = {
        module_index: midx, on: !!on, model_id: mid, category: cat, flags,
        raw_floats: floats.map(round4),
      };
      if (tables) {
        if (cat === 10) {
          const c = tables.cab(mid) || tables.cab(mid, true);
          entry.model = c ? c.name : null;
          entry.user_ir = !!c && !!c.user_slot;
        } else {
          const m = tables.model(mid, cat);
          entry.model = m ? m.name : null;
          entry.category_label = m ? m.category_label : null;
        }
        entry.params = {};
        for (const p of tables.paramsOf(mid, cat)) {
          if (p.slot < N_SLOTS) entry.params[p.name] = floats[p.slot];
        }
      }
      out.modules[slot] = entry;
    }

    const ctrl = {};
    readCtrl(data).forEach((mods, n) => { if (mods.length) ctrl['CTRL' + (n + 1)] = mods; });
    out.ctrl = ctrl;

    const exp = checksum(data), got = getU16BE(data, data.length - 2);
    out.checksum = { stored: got, computed: exp, valid: exp === got };
    out.patch_vol = data[OFF_PATCH_VOL];
    return out;
  }

  // --------------------------------------------------------- validation (agent)
  /** Pre-valide noms de modeles ET de parametres, avec suggestions. */
  function checkNames(tb, spec, keep) {
    const errs = [];
    const mods = spec.modules || {};
    for (const slot of Object.keys(mods)) {
      const ms = mods[slot];
      if (ms === null || ms === undefined) continue;
      if (typeof ms !== 'object' || Array.isArray(ms)) {
        errs.push('slot ' + slot + ' : doit etre un objet {"model": ..., "on": ..., "params": {...}} ou null');
        continue;
      }
      if (!pyTruthy(ms.model)) continue;
      if (!has(SLOT_ACCEPTS, slot)) {
        errs.push('slot ' + pyRepr(slot) + ' inconnu (attendus: ' + pyRepr(MODULES) + ')');
        continue;
      }
      let found;
      try {
        found = tb.find(slot, ms.model);
      } catch (e) {
        let pool;
        if (slot === 'CAB') pool = tb.cabs.filter(c => !c.user_slot).map(c => c.name);
        else pool = tb.modelsForSlot(slot).map(x => x[0].name);
        const near = closeMatches(String(ms.model), pool, 4, 0.4);
        errs.push('slot ' + slot + ' : le modele ' + pyRepr(ms.model) + " N'EXISTE PAS. Proches : " +
          pyRepr(near.length ? near : pool.slice(0, 8)));
        continue;
      }
      const m = found[0], cat = found[1];
      if (!tb.inMenu(slot, m)) {
        // affinage : un modele deja present dans ce slot du preset d'origine est conserve tel quel (ancien preset hors menu)
        const kept = keep && keep[slot] && keep[slot].model;
        if (!(kept && norm(kept) === norm(ms.model))) {
          const pool = tb.modelsForSlot(slot).map(x => x[0].name);
          const near = closeMatches(String(ms.model), pool, 4, 0.4);
          errs.push('slot ' + slot + ' : le modele ' + pyRepr(m.name) + ' n\'est PAS propose dans ce slot par la pedale (il va dans : ' +
            (m.slots && m.slots.length ? m.slots.join(', ') : '?') + '). Proches dans ' + slot + ' : ' + pyRepr(near.length ? near : pool.slice(0, 8)));
          continue;
        }
      }
      const mid = cat === 10 ? m.model_id : m.id;
      const plist = tb.paramsOf(mid, cat);
      const known = new Map();
      for (const p of plist) known.set(norm(p.name), p);
      const params = ms.params == null ? {} : ms.params;
      if (typeof params !== 'object' || Array.isArray(params)) {
        errs.push('slot ' + slot + ' / ' + m.name + ' : "params" doit etre un objet {"Nom": valeur}');
        continue;
      }
      for (const g of Object.keys(params)) {
        const val = params[g];
        const p = known.get(norm(g));
        if (p === undefined) {
          const near = closeMatches(g, plist.map(p2 => p2.name), 3, 0.4);
          errs.push('slot ' + slot + ' / ' + m.name + ' : le parametre ' + pyRepr(g) +
            " N'EXISTE PAS. Parametres reels : " + pyRepr(plist.map(p2 => p2.name)) +
            (near.length ? ' (proche : ' + pyRepr(near) + ')' : ''));
          continue;
        }
        const v = pyFloat(val);
        if (v === undefined) {
          errs.push('slot ' + slot + ' / ' + m.name + ' / ' + p.name + ' : ' + pyRepr(val) + " n'est pas un nombre");
          continue;
        }
        const lo = Math.min(p.min, p.max), hi = Math.max(p.min, p.max);
        if (!(lo <= v && v <= hi)) {
          errs.push('slot ' + slot + ' / ' + m.name + ' / ' + p.name + ' : ' + fmtG(v) +
            ' est hors plage [' + fmtG(lo) + '..' + fmtG(hi) + ']');
        }
      }
    }
    const n = spec.name === undefined ? '' : spec.name;
    if (typeof n === 'string' && chars(n).length > 16) {
      errs.push('name ' + pyRepr(n) + ' fait ' + chars(n).length + ' caracteres (max 16)');
    }
    const ch = spec.chain_order;
    if (ch !== undefined && ch !== null) {
      const ok = Array.isArray(ch) && ch.length === 11 &&
        ch.slice().sort((p, q) => p - q).every((v, i) => v === i);
      if (!ok) errs.push('chain_order ' + pyRepr(ch) + " n'est pas une permutation de 0..10");
    }
    return errs;
  }

  function normalizePayload(payload) {
    if (pyTruthy(payload.sections)) return payload;
    const out = Object.assign({}, payload);
    out.sections = [{ nom: 'Preset', role: '', raison: '', variants: payload.variants || [] }];
    return out;
  }

  function variantSignature(v) {
    const spec = (pyTruthy(v.spec) ? v.spec : {});
    const mods = pyTruthy(spec.modules) ? spec.modules : {};
    const g = k => (pyTruthy(mods[k]) ? mods[k] : {});
    const amp = g('AMP').model, cab = g('CAB').model;
    const active = ['PRE', 'WAH', 'DST', 'MOD', 'DLY', 'RVB', 'EQ']
      .filter(k => pyTruthy(g(k).on) && pyTruthy(g(k).model)).sort();
    const fxModels = active.map(k => g(k).model);
    let gain = null;
    for (const gk of ['Gain', 'Gain 1', 'Drive']) {
      const ap = pyTruthy(g('AMP').params) ? g('AMP').params : {};
      const gv = ap[gk];
      if (typeof gv === 'number') { gain = pyRound(gv / 15); break; }
    }
    return JSON.stringify([amp === undefined ? null : amp, cab === undefined ? null : cab,
                           active, fxModels, gain]);
  }

  function checkDivergence(section) {
    const seen = new Map(), errs = [];
    for (const v of (section.variants || [])) {
      const sig = variantSignature(v);
      if (sig === '[null,null,[],[],null]') continue;
      if (seen.has(sig)) {
        errs.push('les variantes ' + pyRepr(seen.get(sig)) + ' et ' + pyRepr(v.label === undefined ? '?' : v.label) +
          ' sont quasi identiques (meme ampli, meme baffle, memes effets et meme gain). ' +
          'Fais-les diverger d\'un cran de facon audible -- change le dosage ou le choix ' +
          'des effets, le niveau de gain/saturation, ou l\'ampli/baffle -- tout en gardant ' +
          'le son du morceau.');
      } else {
        seen.set(sig, v.label === undefined ? '?' : v.label);
      }
    }
    return errs;
  }

  /** Valide la structure renvoyee. Renvoie [erreurs_fatales, avertissements_style]. */
  function checkSections(tb, payload) {
    const errs = [], warns = [];
    const secs = payload.sections || [];
    if (!pyTruthy(secs)) return [['aucune section : il en faut au moins une'], []];
    if (secs.length > 4) {
      errs.push(secs.length + ' sections, c\'est trop (4 maximum). Regroupe les parties qui partagent le meme son.');
    }
    const noms = [];
    for (const sec of secs) {
      const lbl = pyTruthy(sec.nom) ? sec.nom : '?';
      noms.push(lbl);
      if (pyTruthy(sec.role) && ROLES.indexOf(sec.role) < 0) {
        errs.push('section ' + pyRepr(lbl) + ' : role ' + pyRepr(sec.role) + ' invalide (attendus : ' + ROLES.join(', ') + ')');
      }
      const vs = sec.variants || [];
      if (vs.length !== 3) {
        errs.push('section ' + pyRepr(lbl) + ' : ' + vs.length + ' variante(s), il en faut EXACTEMENT 3');
      }
      for (const v of vs) {
        for (const e of checkNames(tb, v.spec === undefined ? {} : (v.spec || {}))) {
          errs.push('[' + lbl + ' / ' + (v.label === undefined ? '?' : v.label) + '] ' + e);
        }
      }
      for (const w of checkDivergence(sec)) warns.push('section ' + pyRepr(lbl) + ' : ' + w);
    }
    if (new Set(noms).size !== noms.length) {
      errs.push('deux sections portent le meme nom : ' + pyRepr(noms));
    }
    const allnames = [];
    for (const sec of secs) for (const v of (sec.variants || [])) allnames.push((v.spec || {}).name);
    const dupes = Array.from(new Set(allnames.filter(n => n && allnames.filter(x => x === n).length > 1))).sort();
    if (dupes.length) {
      errs.push('noms de presets dupliques entre sections : ' + pyRepr(dupes) +
        ". Rends-les distincts (ex. 'MOP Rythm Fid' et 'MOP Solo Fid').");
    }
    return [errs, warns];
  }

  // -------------------------------------------------------- JSON de reponse
  function extractJson(txt) {
    txt = String(txt).trim().replace(/^\s*```(?:json)?|```\s*$/gim, '');
    const i = txt.indexOf('{'), j = txt.lastIndexOf('}');
    if (i < 0 || j < 0) throw new ValueError('Aucun JSON dans la reponse : ' + txt.slice(0, 200));
    const s = txt.slice(i, j + 1).replace(/,\s*([}\]])/g, '$1');
    try { return JSON.parse(s); } catch (e) { throw new ValueError(e.message); }
  }

  // --------------------------------------------------------- noms de fichiers
  function safeFilename(s) {
    return String(s).replace(/[^A-Za-z0-9_.-]+/g, '_').replace(/^_+|_+$/g, '') || 'preset';
  }
  /** os.path.splitext(os.path.basename(name))[0] (les points de tete ne comptent pas comme extension). */
  function splitextBase(name) {
    let b = String(name); b = b.slice(b.lastIndexOf('/') + 1);
    let lead = 0; while (lead < b.length && b[lead] === '.') lead++;
    const dot = b.lastIndexOf('.');
    return dot > lead ? b.slice(0, dot) : b;
  }
  function safeDirname(s) {
    s = String(s).replace(/[\\/:*?"<>|\x00-\x1f]+/g, ' ');
    s = s.replace(/\s+/g, ' ').replace(/^[ .]+|[ .]+$/g, '');
    return s || 'preset';
  }

  // ---------------------------------------------------------- consignes (prompt)
  function forcedPrompt(roles, roleHint) {
    if (!roles || !roles.length) return '';
    return '\n\nCONSIGNE IMPERATIVE : ne determine PAS la structure toi-meme. ' +
      'Produis EXACTEMENT ' + roles.length + ' section(s), une par role demande, dans cet ' +
      'ordre : ' + roles.join(', ') + '.\n' +
      roles.map(r => '  - ' + r + ' : ' + roleHint[r]).join('\n');
  }

  /** = fill_default_cab (gp200_agent.py) : pose la baffle par defaut de l'ampli quand l'IA n'en donne pas (audit du 04/10 : un changement
   *  d'ampli fait charger a la pedale sa baffle par defaut ; 71 amplis confirmes, tous d'accord avec `defcab`). */
  function fillDefaultCab(spec, tb) {
    const mods = pyTruthy(spec) && pyTruthy(spec.modules) && typeof spec.modules === 'object' ? spec.modules : null;
    if (!mods) return spec;
    const amp = mods.AMP;
    if (!pyTruthy(amp) || !pyTruthy(amp.model) || !pyTruthy(has(amp, 'on') ? amp.on : true)) return spec;
    const cab = mods.CAB;
    if (pyTruthy(cab) && pyTruthy(cab.model)) return spec;
    let found;
    try { found = tb.find('AMP', amp.model); } catch (e) { if (e instanceof ValueError) return spec; throw e; }
    const m = found[0];
    if (m.defcab === null || m.defcab === undefined) return spec;
    const c = tb.cabById.get(m.defcab);
    if (!c) return spec;
    mods.CAB = { model: c.name, on: true, params: {} };
    return spec;
  }

  function applyPatchVol(raw, pv) {
    pv = pv === undefined ? 70 : pv;
    const b = new Uint8Array(raw);
    b[OFF_PATCH_VOL] = pv;
    setU16BE(b, FILE_SIZE - 2, checksum(b));
    return [b, pv];
  }

  // =============================================================== generation
  /**
   * Boucle complete : demande -> API -> validation -> auto-correction -> .prst.
   * Reprend generate() de gp200_agent.py.
   *
   *   cfg   : {provider, apiKey, model, webSearch, maxRetries, pickup, lang, maxTokens}
   *   prompts: {SYSTEM, catalogFull, catalogLight, ROLE_HINT, pickup:{}, lang:{}}
   *   hooks : {callApi(cfg, system, msgs) -> {text, truncated}, log(line), t(key,...args),
   *            template (Uint8Array), now (Date, optionnel), signal (AbortSignal)}
   * Renvoie {payload, files:[{section, variant, filename, folder, raw, spec, warnings,
   *          decoded}], folder}.
   */
  async function generate(cfg, tb, demande, prompts, hooks, roles) {
    const log = hooks.log || (() => {});
    const t = hooks.t || (k => k);
    const model = String(cfg.model || '').toLowerCase();
    const isFree = model.indexOf('free') >= 0;
    if (isFree) log(t('log_light_catalog'));
    const system = prompts.SYSTEM + (isFree ? prompts.catalogLight : prompts.catalogFull);
    const lang = cfg.lang || 'fr';
    const pk = prompts.pickup[cfg.pickup || 'auto'] || '';
    const langInstr = prompts.lang[lang] || prompts.lang.fr;
    const content = demande + forcedPrompt(roles, prompts.ROLE_HINT) + pk + langInstr;
    let msgs = [{ role: 'user', content }];

    const maxRetries = cfg.maxRetries === undefined ? 2 : Number(cfg.maxRetries);
    let payload = null, ok = false;

    for (let attempt = 0; attempt <= maxRetries; attempt++) {
      if (hooks.signal && hooks.signal.aborted) throw new Error('aborted');
      log(t('log_api_attempt', attempt + 1));
      const reply = await hooks.callApi(cfg, system, msgs);
      const txt = reply.text;
      try {
        payload = extractJson(txt);
      } catch (e) {
        if (reply.truncated) {
          log(t('log_json_cut'));
          msgs = [{ role: 'user', content: demande + forcedPrompt(roles, prompts.ROLE_HINT) + pk + langInstr +
            '\n\nIMPORTANT : ta reponse precedente a ete coupee car trop longue. Sois BEAUCOUP plus ' +
            'concis : le champ "recherche" fait 5 phrases maximum, "axe", "ecoute" et "raison" une ' +
            'phrase chacun, "notes" 3 phrases. Ne precise que les parametres qui comptent, et ne cree ' +
            'pas de section inutile.' }];
        } else {
          log(t('log_unreadable', e.message));
          msgs = msgs.concat([{ role: 'assistant', content: txt },
            { role: 'user', content: "Ta reponse n'etait pas un JSON valide. Renvoie UNIQUEMENT l'objet JSON demande, sans texte ni balises." }]);
        }
        continue;
      }

      payload = normalizePayload(payload);
      const [errs, warns] = checkSections(tb, payload);
      if (roles && roles.length) {
        const got = (payload.sections || []).map(s => s.role);
        if (JSON.stringify(got) !== JSON.stringify(roles)) {
          errs.push('sections imposees : attendu ' + pyRepr(roles) + ', recu ' + pyRepr(got));
        }
      }
      // "Turbo & Eco" : pour Claude, les avertissements de style ne declenchent pas de relance.
      const isPremium = model.indexOf('claude') >= 0;
      let toFix;
      if (isPremium) {
        toFix = errs;
        if (warns.length) {
          log(t('log_style_ignored', model));
          for (const w of warns) log('  ! ' + w);
        }
      } else {
        toFix = errs.concat(warns);
      }
      if (!toFix.length) { ok = true; break; }

      log(t('log_errors_fix', toFix.length));
      for (const e of toFix) log('    - ' + e);
      msgs = msgs.concat([{ role: 'assistant', content: txt },
        { role: 'user', content: 'Erreurs a corriger dans ta reponse :\n- ' + toFix.join('\n- ') +
          "\n\nRenvoie l'objet JSON complet corrige, en n'utilisant que des noms presents dans le catalogue." }]);
    }
    if (!ok) throw new Error(t('err_gen_failed', maxRetries + 1));

    // ---- noms de dossier / fichiers (meme convention que l'appli de bureau)
    const now = hooks.now || new Date();
    const p2 = n => String(n).padStart(2, '0');
    const datePart = '' + now.getFullYear() + p2(now.getMonth() + 1) + p2(now.getDate());
    const heurePart = p2(now.getHours()) + p2(now.getMinutes()) + p2(now.getSeconds());
    const artiste = safeDirname(String(payload.artiste || '').trim());
    const titre = chars(safeDirname(String(payload.titre || '').trim())).slice(0, 40).join('').trim();
    let prefixe;
    if (artiste && artiste !== 'preset') prefixe = artiste + ' - ' + titre;
    else if (titre && titre !== 'preset') prefixe = titre;
    else prefixe = chars(safeDirname(demande)).slice(0, 40).join('').trim();
    const folder = prefixe + ' - ' + datePart + ' - ' + heurePart;

    const files = [];
    const secs = payload.sections || [];
    secs.forEach((sec, si0) => {
      const si = si0 + 1;
      const secdir = secs.length > 1
        ? si + '_' + safeFilename(sec.nom || sec.role || 'section') : '';
      log(t('log_section', si, secs.length, sec.nom, sec.role || '?'));
      (sec.variants || []).forEach((v, i) => {
        try {
          const spec = v.spec;
          if (!spec) throw new ValueError("pas de 'spec'");
          fillDefaultCab(spec, tb);
          let enc = encodePrst(spec, tb, hooks.template);
          const pvr = applyPatchVol(enc.raw);
          const raw = pvr[0];
          const filename = safeFilename(spec.name === undefined ? 'preset' : spec.name) + '_' +
            (i < 3 ? 'ABC'[i] : String(i)) + '.prst';
          const decoded = decodePrst(raw, tb);
          if (!decoded.checksum.valid) log(t('log_checksum_bad', filename));
          for (const w of enc.warnings) log(t('log_warn', w));
          files.push({ section: sec, variant: v, filename, folder: secdir, raw, spec,
                       warnings: enc.warnings, decoded });
          log(t('log_written', filename));
        } catch (e) {
          log(t('log_variant_skip', v.label === undefined ? i : v.label, e.message));
        }
      });
    });
    return { payload, files, folder };
  }

  // ================================================================ AFFINER
  /** Marque un nombre comme "float" Python pour json.dumps (50 -> 50.0). */
  class PyFloat { constructor(v) { this.v = v; } }
  function pyFloatJson(x) {
    if (Number.isNaN(x)) return 'NaN';
    if (x === Infinity) return 'Infinity';
    if (x === -Infinity) return '-Infinity';
    if (Number.isInteger(x) && Math.abs(x) < 1e16) return Object.is(x, -0) ? '-0.0' : x.toFixed(1);
    return String(x);
  }
  /** json.dumps(obj, indent=indent, ensure_ascii=False) de Python, avec PyFloat. */
  function pyJsonDumps(obj, indent, level) {
    level = level || 0;
    const pad = n => ' '.repeat(indent * n);
    if (obj instanceof PyFloat) return pyFloatJson(obj.v);
    if (obj === null || obj === undefined) return 'null';
    if (typeof obj === 'boolean') return obj ? 'true' : 'false';
    if (typeof obj === 'number') return String(obj);
    if (typeof obj === 'string') return JSON.stringify(obj);
    if (Array.isArray(obj)) {
      if (!obj.length) return '[]';
      return '[\n' + obj.map(x => pad(level + 1) + pyJsonDumps(x, indent, level + 1)).join(',\n') + '\n' + pad(level) + ']';
    }
    const keys = Object.keys(obj);
    if (!keys.length) return '{}';
    return '{\n' + keys.map(k => pad(level + 1) + JSON.stringify(k) + ': ' + pyJsonDumps(obj[k], indent, level + 1)).join(',\n') + '\n' + pad(level) + '}';
  }

  /** Preset decode -> spec reutilisable par l'encodeur (= decoded_to_spec). Valeurs en PyFloat. */
  function decodedToSpec(d) {
    const mods = {};
    for (const slot of MODULES) {
      const e = d.modules[slot];
      if (!e.model) { mods[slot] = null; continue; }
      const params = {};
      for (const k of Object.keys(e.params || {})) params[k] = new PyFloat(round4(Number(e.params[k])));
      mods[slot] = { model: e.model, on: e.on, params };
    }
    return { name: d.name, author: d.author || '', description: d.description || '',
      chain_order: d.chain_order || Array.from({ length: 11 }, (_, i) => i), modules: mods };
  }
  /** Retire les PyFloat : spec "ordinaire" (pour affichage). */
  function plainSpec(spec) {
    return JSON.parse(JSON.stringify(spec, (k, v) => (v instanceof PyFloat ? v.v : v)));
  }

  /** Diff REEL entre deux presets decodes (= diff_presets). */
  function diffPresets(before, after) {
    const out = [];
    if (before.name !== after.name) out.push('nom : ' + pyRepr(before.name) + ' -> ' + pyRepr(after.name));
    if (JSON.stringify(before.chain_order) !== JSON.stringify(after.chain_order)) {
      out.push('chaine : ' + pyRepr(before.chain_readable) + ' -> ' + pyRepr(after.chain_readable));
    }
    for (const slot of MODULES) {
      const b = before.modules[slot], a = after.modules[slot];
      if ((b.model || null) !== (a.model || null)) {
        out.push(slot + ' : ' + (b.model || '(vide)') + ' -> ' + (a.model || '(vide)'));
        continue;
      }
      if (b.on !== a.on) out.push(slot + ' : ' + (b.on ? 'ON' : 'off') + ' -> ' + (a.on ? 'ON' : 'off'));
      const pb = b.params || {}, pa = a.params || {};
      for (const k of Object.keys(pa)) {
        if (has(pb, k) && Math.abs(Number(pb[k]) - Number(pa[k])) > 0.005) {
          out.push(slot + ' / ' + k + ' : ' + fmtG(Number(pb[k])) + ' -> ' + fmtG(Number(pa[k])));
        }
      }
    }
    return out;
  }

  /**
   * Modifie un preset existant (= refine / refine_live de gp200_agent.py).
   * mode 'refine' (consigne libre) ou 'live' (prompt "pret pour le concert", consigne pre-cablee).
   * src = {raw: Uint8Array, name: nom du fichier source}. Renvoie
   * {payload, raw, filename, folder, spec, diff, warnings, decoded, before}.
   */
  async function refine(cfg, tb, src, instruction, prompts, hooks, mode) {
    const log = hooks.log || (() => {});
    const t = hooks.t || (k => k);
    const live = mode === 'live';
    const before = decodePrst(src.raw, tb);
    if (!before.checksum.valid) log(t('log_src_checksum'));
    const specIn = decodedToSpec(before);
    const system = (live ? prompts.SYSTEM_LIVE_READY : prompts.SYSTEM_REFINE) + prompts.catalogFull;
    const lang = cfg.lang || 'fr';
    const demande = 'PRESET ACTUEL :\n' + pyJsonDumps(specIn, 1) + '\n\nDEMANDE DE MODIFICATION :\n' +
      (live ? prompts.LIVE_READY_INSTRUCTION : instruction) + (prompts.lang[lang] || prompts.lang.fr);
    let msgs = [{ role: 'user', content: demande }];

    const maxRetries = cfg.maxRetries === undefined ? 2 : Number(cfg.maxRetries);
    let payload = null, ok = false;
    for (let attempt = 0; attempt <= maxRetries; attempt++) {
      if (hooks.signal && hooks.signal.aborted) throw new Error('aborted');
      log(t('log_api_attempt', attempt + 1));
      const reply = await hooks.callApi(cfg, system, msgs);
      const txt = reply.text;
      try {
        payload = extractJson(txt);
      } catch (e) {
        log(t('log_unreadable', e.message));
        msgs = [{ role: 'user', content: demande + "\n\nRenvoie UNIQUEMENT l'objet JSON demande, sans texte ni balises." }];
        continue;
      }
      if (payload === null || typeof payload !== 'object' || Array.isArray(payload)) throw new Error('reponse inattendue : ' + pyRepr(payload));
      const errs = checkNames(tb, payload.spec || {}, specIn.modules);
      if (!errs.length) { ok = true; break; }
      log(t('log_errors_fix', errs.length));
      for (const e of errs) log(t('log_bullet', e));
      msgs = msgs.concat([{ role: 'assistant', content: txt },
        { role: 'user', content: 'Erreurs a corriger :\n- ' + errs.join('\n- ') + "\n\nRenvoie l'objet JSON complet corrige." }]);
    }
    if (!ok) throw new Error(t('err_gen_failed', maxRetries + 1));

    const now = hooks.now || new Date();
    const p2 = n => String(n).padStart(2, '0');
    const datePart = '' + now.getFullYear() + p2(now.getMonth() + 1) + p2(now.getDate());
    const heurePart = p2(now.getHours()) + p2(now.getMinutes()) + p2(now.getSeconds());
    const srcBase = splitextBase(src.name || 'preset');
    const srcDir = chars(safeDirname(srcBase)).slice(0, 40).join('').trim();
    const folder = srcDir + (live ? ' (live)' : ' (affine)') + ' - ' + datePart + ' - ' + heurePart;

    const spec = payload.spec;
    const enc = encodePrst(spec, tb, hooks.template);
    const base = safeFilename(pyTruthy(spec.name) ? spec.name : srcBase);
    const filename = base + (live ? '_live.prst' : '_v2.prst');
    for (const w of enc.warnings) log(t('log_warn', w));
    const after = decodePrst(enc.raw, tb);
    if (!after.checksum.valid) throw new Error('checksum invalide : ' + filename);
    log(t('log_written2', filename));
    return { payload, raw: enc.raw, filename, folder, spec, diff: diffPresets(before, after), warnings: enc.warnings, decoded: after, before };
  }

  /** Edition "en place" d'un parametre (= SlotControlPopup._sync_param_value) + checksum. */
  function patchParam(raw, moduleIdx, paramIdx, value) {
    const rec0 = findBytes(raw, REC_MAGIC);
    if (rec0 < 12) throw new ValueError('Enregistrements de module introuvables');
    if (!(moduleIdx >= 0 && moduleIdx < N_MODULES) || !(paramIdx >= 0 && paramIdx < N_SLOTS)) throw new ValueError('slot/parametre hors limites');
    new DataView(raw.buffer, raw.byteOffset, raw.byteLength).setFloat32(rec0 + moduleIdx * RECORD_SIZE + 12 + paramIdx * 4, value, true);
    setU16BE(raw, raw.length - 2, checksum(raw));
    return raw;
  }

  /** Bascule ON/OFF d'un module dans les octets (octet +5 de l'enregistrement) + checksum. */
  function patchOn(raw, moduleIdx, on) {
    const rec0 = findBytes(raw, REC_MAGIC);
    if (rec0 < 12) throw new ValueError('Enregistrements de module introuvables');
    raw[rec0 + moduleIdx * RECORD_SIZE + 5] = on ? 1 : 0;
    setU16BE(raw, raw.length - 2, checksum(raw));
    return raw;
  }

  /** Remplace l'enregistrement du module k de `raw` par celui de `other` (EN PLACE) + checksum. */
  function replaceRecord(raw, other, moduleIdx) {
    const a = findBytes(raw, REC_MAGIC), b = findBytes(other, REC_MAGIC);
    if (a < 12 || b < 12) throw new ValueError('Enregistrements de module introuvables');
    for (let i = 0; i < RECORD_SIZE; i++) raw[a + moduleIdx * RECORD_SIZE + i] = other[b + moduleIdx * RECORD_SIZE + i];
    setU16BE(raw, raw.length - 2, checksum(raw));
    return raw;
  }

  /** Ecrit la table CTRL ({1: ['AMP',..], ...}) dans une COPIE et recalcule le checksum
   *  (= CtrlDialog._save du Python). */
  function setCtrl(raw, ctrl) {
    const out = Uint8Array.from(raw);
    writeCtrl(out, ctrl);
    setU16BE(out, out.length - 2, checksum(out));
    return out;
  }

  /** Recopie d'un preset source vers un preset affine : table CTRL et patch volume
   *  (que l'encodeur remet a zero / par defaut). Ne fait PAS partie du Python. */
  function carryOver(srcRaw, raw) {
    const out = Uint8Array.from(raw);
    const ctrl = {};
    readCtrl(srcRaw).forEach((mods, n) => { ctrl[n + 1] = mods; });
    writeCtrl(out, ctrl);
    out[OFF_PATCH_VOL] = srcRaw[OFF_PATCH_VOL];
    setU16BE(out, out.length - 2, checksum(out));
    return out;
  }

  // ===================================================================== ZIP
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  /** Zip "stored" (sans compression : les .prst font 1224 octets, inutile de compresser). */
  function buildZip(entries, date) {
    const enc = new TextEncoder();
    const d = date || new Date();
    const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    const parts = [], central = [];
    let offset = 0;
    for (const e of entries) {
      const nameB = enc.encode(e.name);
      const crc = crc32(e.data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
      lh.setUint16(8, 0, true); lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, e.data.length, true); lh.setUint32(22, e.data.length, true);
      lh.setUint16(26, nameB.length, true); lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), nameB, e.data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, dosTime, true);
      ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true); ch.setUint32(20, e.data.length, true);
      ch.setUint32(24, e.data.length, true); ch.setUint16(28, nameB.length, true);
      ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true);
      ch.setUint16(36, 0, true); ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
      central.push(new Uint8Array(ch.buffer), nameB);
      offset += 30 + nameB.length + e.data.length;
    }
    const cdSize = central.reduce((s, p) => s + p.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(4, 0, true); end.setUint16(6, 0, true);
    end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
    end.setUint32(12, cdSize, true); end.setUint32(16, offset, true); end.setUint16(20, 0, true);
    const all = parts.concat(central, [new Uint8Array(end.buffer)]);
    const out = new Uint8Array(all.reduce((s, p) => s + p.length, 0));
    let pos = 0;
    for (const p of all) { out.set(p, pos); pos += p.length; }
    return out;
  }

  // ============================================================= fournisseurs
  const GEMINI_BASE = 'https://generativelanguage.googleapis.com/v1beta';
  const ANTHROPIC_URL = 'https://api.anthropic.com/v1/messages';
  const ANTHROPIC_VERSION = '2023-06-01';
  const OPENROUTER_URL = 'https://openrouter.ai/api/v1/chat/completions';

  class ApiError extends Error {
    constructor(status, message, extra) {
      super(message);
      this.name = 'ApiError';
      this.status = status;
      Object.assign(this, extra || {});
    }
  }

  const sleep = (ms, signal) => new Promise((res, rej) => {
    const id = setTimeout(res, ms);
    if (signal) signal.addEventListener('abort', () => { clearTimeout(id); rej(new Error('aborted')); }, { once: true });
  });

  /**
   * POST/GET JSON avec delai maximal, annulation et relances sur 429/503
   * (les offres gratuites renvoient souvent "modele surcharge").
   */
  async function httpJson(url, body, headers, o) {
    o = o || {};
    const timeout = o.timeout || 180000;
    const retries = o.retries === undefined ? 2 : o.retries;
    const log = o.log || (() => {});
    for (let attempt = 0; ; attempt++) {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(new Error('timeout')), timeout);
      if (o.signal) {
        if (o.signal.aborted) throw new Error('aborted');
        o.signal.addEventListener('abort', () => ctl.abort(new Error('aborted')), { once: true });
      }
      let res;
      try {
        res = await fetch(url, {
          method: body === undefined ? 'GET' : 'POST',
          headers, body: body === undefined ? undefined : JSON.stringify(body),
          signal: ctl.signal,
        });
      } catch (e) {
        clearTimeout(timer);
        if (o.signal && o.signal.aborted) throw new Error('aborted');
        if (ctl.signal.aborted) throw new ApiError(0, 'timeout', { kind: 'timeout' });
        throw new ApiError(0, String(e && e.message || e), { kind: 'network' });
      }
      clearTimeout(timer);
      const raw = await res.text();
      let data = null;
      try { data = JSON.parse(raw); } catch (_) { /* corps non JSON */ }
      if (res.ok) return data === null ? {} : data;

      let msg = raw.slice(0, 400);
      if (data && data.error) {
        msg = (typeof data.error === 'string' ? data.error : (data.error.message || msg));
      }
      const retryAfter = res.headers.get('retry-after');
      const credit = res.status === 429 && /credit/i.test(msg);
      if ((res.status === 429 || res.status === 503) && !credit && attempt < retries) {
        const wait = Math.min(30000, retryAfter ? Number(retryAfter) * 1000 || 4000 : 4000 * (attempt + 1) * (attempt + 1));
        log('http', res.status, Math.round(wait / 1000));
        await sleep(wait, o.signal);
        continue;
      }
      throw new ApiError(res.status, msg, { retryAfter, credit });
    }
  }

  function keyOf(cfg) { return String(cfg.apiKey || '').trim(); }

  async function callGemini(cfg, system, msgs, ctx) {
    const body = {
      system_instruction: { parts: [{ text: system }] },
      contents: msgs.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })),
      generationConfig: { maxOutputTokens: Number(cfg.maxTokens || 16000), temperature: 0.7 },
    };
    // le grounding Google Search est incompatible avec le mode JSON force
    if (cfg.webSearch) body.tools = [{ google_search: {} }];
    else body.generationConfig.responseMimeType = 'application/json';
    const d = await httpJson(GEMINI_BASE + '/models/' + cfg.model + ':generateContent', body,
      { 'content-type': 'application/json', 'x-goog-api-key': keyOf(cfg) }, ctx);
    const u = d.usageMetadata || {};
    ctx.log('tokens', u.promptTokenCount, u.candidatesTokenCount);
    const cands = d.candidates || [];
    if (!cands.length) {
      throw new ApiError(0, 'Gemini n\'a rien renvoye (' + JSON.stringify(d.promptFeedback || 'raison inconnue') + ')', { kind: 'empty' });
    }
    const c = cands[0];
    if (['SAFETY', 'RECITATION', 'BLOCKLIST'].indexOf(c.finishReason) >= 0) {
      throw new ApiError(0, 'Reponse bloquee par Gemini : ' + c.finishReason, { kind: 'blocked' });
    }
    const truncated = c.finishReason === 'MAX_TOKENS';
    if (truncated) ctx.log('truncated');
    const parts = (c.content && c.content.parts) || [];
    return { text: parts.filter(p => 'text' in p && !p.thought).map(p => p.text).join('\n').trim(), truncated };
  }

  async function callAnthropic(cfg, system, msgs, ctx) {
    const body = {
      model: cfg.model, max_tokens: Number(cfg.maxTokens || 16000),
      system: [{ type: 'text', text: system, cache_control: { type: 'ephemeral' } }],
      messages: msgs,
    };
    if (cfg.webSearch) {
      body.tools = [{ type: 'web_search_20250305', name: 'web_search', max_uses: Number(cfg.maxSearches || 3) }];
    }
    const d = await httpJson(ANTHROPIC_URL, body, {
      'content-type': 'application/json', 'x-api-key': keyOf(cfg),
      'anthropic-version': ANTHROPIC_VERSION,
      // obligatoire pour appeler l'API depuis un navigateur
      'anthropic-dangerous-direct-browser-access': 'true',
    }, ctx);
    const u = d.usage || {};
    ctx.log('tokens', u.input_tokens, u.output_tokens);
    const truncated = d.stop_reason === 'max_tokens';
    if (truncated) ctx.log('truncated');
    return { text: (d.content || []).filter(b => b.type === 'text').map(b => b.text || '').join('\n').trim(), truncated };
  }

  async function callOpenRouter(cfg, system, msgs, ctx) {
    const full = [{ role: 'system', content: system }].concat(
      msgs.map(m => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content })));
    const body = { model: cfg.model, messages: full, temperature: 0.7, max_tokens: Number(cfg.maxTokens || 16000) };
    const hdrs = {
      'content-type': 'application/json', 'authorization': 'Bearer ' + keyOf(cfg),
      'HTTP-Referer': 'https://github.com/rudywidmer/GP200-Studio', 'X-Title': 'GP-200 Studio',
    };
    let d;
    try {
      d = await httpJson(OPENROUTER_URL, body, hdrs, ctx);
    } catch (e) {
      // Un modele gratuit peut passer en payant du jour au lendemain : l'API 404
      // en indiquant le bon identifiant. On le reprend et on reessaie une fois.
      const m = /use this slug instead:\s*([\w./:-]+)/.exec(String(e.message));
      if (e.status === 404 && m) {

  async function generate() {

    const controller = new AbortController();
    s.run = { running: true, status: T('st_wait'), log: [], error: null, controller };

      logLine('  ! ' + String((e && e.message) || e));
    }

  /** Ouvre un ou plusieurs .prst (bouton, glisser-deposer) et les ajoute a la liste. */
  async function openFiles(list) {
    const arr = Array.from(list || []);
    if (!arr.length) return;
    let n = 0, badSum = false;
    const errs = [], added = [];
    const batch = s.tab === 'tune';          // ouverts depuis la fenetre Volume : ils rejoignent le lot, la fenetre reste ouverte, rien n'est envoye a la pedale
    for (const f of arr) {
      try {
        const buf = new Uint8Array(await f.arrayBuffer());
        if (buf.length !== G.FILE_SIZE) throw new Error(T('ref_size', buf.length));
        const dec = G.decodePrst(buf, tb);
        if (!dec.checksum.valid) badSum = true;
        const r1 = singleRes(f.name || 'preset.prst', buf, dec);
        addRes(r1, 'open', dec.name || f.name, batch);
        added.push(r1.files[0]);
        n++;
      } catch (e) { errs.push((f.name || '?') + ' : ' + T('ref_bad', String((e && e.message) || e))); }
    }
    if (n && batch) {
      const t = s.tune;
      if (!t.sel) t.sel = s.res ? s.res.files.slice() : [];
      added.forEach(x => { if (t.sel.indexOf(x) < 0) t.sel.push(x); });

      s.notice = null; render(); return;
    }

    if (errs.length) s.notice = { kind: 'err', text: errs.join('\n') };
    else if (badSum) s.notice = { kind: 'warn', text: T('ref_checksum') };
    else s.notice = { kind: 'ok', text: T('ref_opened', n) };
    render();
  }

  async function refineRun(live) {

    const file = curFile();
    if (!file) { s.notice = { kind: 'err', text: T('need_file') }; render(); return; }
    const instr = s.ref.instr.trim();
    if (!live && !instr) { s.notice = { kind: 'err', text: T('need_instr') }; render(); focusId('instr'); return; }
    if (!curKey()) { s.notice = { kind: 'err', text: T('need_key') }; s.setupOpen = true; render(); focusId('apikey'); return; }
    const controller = new AbortController();
    s.run = { running: true, status: T('st_wait'), log: [], error: null, controller };
    s.notice = null; if (s.tab === 'log') s.tab = 'module';   // le journal est une fenetre : on ne l'ouvre pas de force pendant le calcul
    render();
    const ai = aiSetup(controller);
    const src = { name: file.filename, raw: Uint8Array.from(file.raw) };
    const fromName = file.spec.name || file.filename;
    let out = null;
    try {
      out = await G.refine(ai.cfg, tb, src, instr, B.prompts, ai.hooks, live ? 'live' : 'refine');
    } catch (e) {
      s.run.error = friendly(e);

    s.run.running = false;

      const raw = G.carryOver(src.raw, out.raw);
      const decoded = G.decodePrst(raw, tb);
      const hadCtrl = G.readCtrl(src.raw).some(m => m.length) || src.raw[G.OFF_PATCH_VOL] !== out.raw[G.OFF_PATCH_VOL];

      res.refine = { payload: out.payload, diff: out.diff, live: !!live, carried: hadCtrl, from: fromName };
      addRes(res, live ? 'live' : 'refine', res.headline);
      s.tab = 'result';
    }
    render();
  }

      used.add(cand.toLowerCase());
      entries.push({ name: root + '/' + cand + '.prst', data: f.raw });
      entries.push({ name: root + '/' + cand + '.json', data: enc.encode(JSON.stringify(f.spec, null, 1)) });
    }
    download(root + '.zip', G.buildZip(entries, new Date()), 'application/zip');
  }

  async function orLogin() {
    try {
      const p = await G.makePkce();
      try { sessionStorage.setItem(PKCE_KEY, p.verifier); } catch (e) { localStorage.setItem(PKCE_KEY, p.verifier); }
      location.href = G.openrouterAuthUrl(location.origin + location.pathname, p.challenge);
    } catch (e) { s.notice = { kind: 'err', text: T('or_ko', e.message) }; render(); }
  }
  async function orCallback() {
    const q = new URLSearchParams(location.search), code = q.get('code');
    if (!code) return;
    let verifier = null;
    try { verifier = sessionStorage.getItem(PKCE_KEY) || localStorage.getItem(PKCE_KEY); } catch (e) { /* rien */ }
    history.replaceState(null, '', location.pathname);
    if (!verifier) return;
    s.provider = 'openrouter'; s.setupOpen = true;
    s.notice = { kind: 'ok', text: T('or_wait') }; render();
    try {
      s.keys.openrouter = await G.openrouterExchange(code, verifier);
      s.notice = { kind: 'ok', text: T('or_ok') }; s.setupOpen = false; save();
    } catch (e) { s.notice = { kind: 'err', text: T('or_ko', friendly(e)) }; }
    try { sessionStorage.removeItem(PKCE_KEY); localStorage.removeItem(PKCE_KEY); } catch (e) { /* rien */ }
    render();
  }

  // ------------------------------------------------- reglage d'un module (direct)
  const clampN = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const linkReady = () => pedalFound() && s.ed.want && !s.usb.sending && !tuneActive();      // on peut tenir le port ouvert
  const liveReady = () => linkReady() && !patchMismatch();                                    // on peut envoyer des reglages (la pedale est sur le patch affiche)

  async function liveStop() {
    const ed = s.ed;
    clearTimeout(ed.timer); ed.timer = null; clearTimeout(ed.idle); ed.idle = null; ed.pending = new Map();
    for (const tm of ed.tails.values()) clearTimeout(tm);
    ed.tails = new Map();
    ed.sync = { file: null, set: new Set() }; ed.pm = new Map();   // la pedale a pu changer de preset entre-temps : on ne suppose plus rien d'elle
    if (!ed.live) return;
    ed.live = false;
    try { if (s.usb.link) await s.usb.link.close(); } catch (e) { /* rien */ }
  }
  /** Ouvre la liaison a la demande (au premier reglage) ; elle se referme apres 15 s d'inactivite pour laisser la pedale a l'editeur Valeton. */
  async function liveEnsure() {
    const ed = s.ed, u = s.usb;
    if (ed.live) return true;
    if (!linkReady()) return false;
    if (ed.opening) return ed.opening;
    ed.opening = (async () => {
      try { u.link.select(u.outId); await u.link.open(); ed.live = true; ed.err = ''; await sleep(300); return true; }   // 300 ms : le temps que le port soit pret avant la 1re trame
      catch (e) { ed.err = T('ed_live_ko', usbErr(e)); render(); return false; }
      finally { ed.opening = null; }
    })();
    return ed.opening;
  }
  function liveTouch() {
    const ed = s.ed;
    clearTimeout(ed.idle);
    if (s.listen.want) return;      // a l'ecoute : le port reste ouvert (decocher l'ecoute pour le rendre a l'editeur Valeton)
    ed.idle = setTimeout(() => { if (!ed.busy && !(ed.pending && ed.pending.size)) liveStop(); else liveTouch(); }, 15000);
  }
  function liveFail(e) {
    liveStop();
    s.ed.err = T('ed_live_ko', usbErr(e)); s.ed.msg = '';
    render();
  }
  // Un numero de parametre n'a de sens que pour le modele charge dans le module : avant le premier reglage d'un module, on envoie donc
  // le module complet (effect change + valeurs), comme le fait la version Windows, pour que la pedale soit sur le meme modele que l'ecran.
  // « synchronise » = la pedale a, pour ce module, le modele ET les valeurs de CE fichier (le dernier envoye).
  const isSynced = (file, slot) => s.ed.sync.file === file && s.ed.sync.set.has(slot);
  function markSynced(file, slot) { const sy = s.ed.sync; if (sy.file !== file) { sy.file = file; sy.set = new Set(); } sy.set.add(slot); }
  function unsync(file, slot) { const sy = s.ed.sync; if (sy.file === file) sy.set.delete(slot); }
  const modKey = e => e.model_id + ',' + e.category;     // modele que la pedale est censee avoir dans un module (connu seulement apres un de nos envois)
  const PGAP = 30;                                       // ms entre deux trames de parametres (la pedale en avale en dessous de ~19 ms)
  function dropPending(file, slot) {
    const ed = s.ed;
    if (!ed.pending) return;
    for (const [k, v] of Array.from(ed.pending)) if (v.meta && v.meta.file === file && v.meta.slot === slot) ed.pending.delete(k);
  }
  /** Envoi limite a 1 trame / 40 ms (le pedalier avale les trames trop rapprochees) ; la derniere valeur de chaque reglage gagne. */
  function liveQueue(key, fn, meta) {
    const ed = s.ed;
    if (patchMismatch() || (!ed.live && !liveReady())) return;
    if (!ed.pending) ed.pending = new Map();
    ed.pending.set(key, { fn, meta });
    if (ed.timer) return;
    const run = async () => {
      ed.timer = null;
      if (!ed.pending || !ed.pending.size) return;
      if (ed.busy) { ed.timer = setTimeout(run, 60); return; }
      if (!ed.live && !(await liveEnsure())) { ed.pending = new Map(); return; }
      if (!ed.pending || !ed.pending.size) return;           // une injection a pu vider la file pendant l'ouverture de la liaison
      const first = ed.pending.keys().next().value, it = ed.pending.get(first);
      ed.pending.delete(first);
      ed.last = Date.now();
      if (it.meta && !isSynced(it.meta.file, it.meta.slot)) {
        // premier reglage de ce module : on envoie le module entier (les valeurs a jour, dont ce reglage, y sont deja)
        dropPending(it.meta.file, it.meta.slot);
        await liveSendModule(it.meta.file, it.meta.slot, false, true);
        if (ed.pending.size && !ed.timer) ed.timer = setTimeout(run, 40);
        return;
      }
      try { it.fn(); } catch (e) { liveFail(e); return; }
      liveTouch();
      tailArm(first, it);
      if (ed.pending.size) ed.timer = setTimeout(run, 40);

    ed.timer = setTimeout(run, Math.max(0, ed.last + 40 - Date.now()));
  }

  /** Renvoie la derniere valeur d'un reglage 180 ms apres le dernier mouvement : la pedale avale parfois une trame (surtout le Time
   *  d'un delay, qui realloue sa ligne a retard) et la derniere valeur est la seule qui compte. Sans effet si le module a change entre-temps. */
  function tailArm(key, it) {
    const ed = s.ed;
    if (!it.meta || !it.meta.mk) return;
    clearTimeout(ed.tails.get(key));
    ed.tails.set(key, setTimeout(function fire() {
      ed.tails.delete(key);
      const m = it.meta, e = m.file.decoded.modules[m.slot];
      if (!ed.live || ed.busy || (ed.pending && ed.pending.has(key)) || !e || modKey(e) !== m.mk || !isSynced(m.file, m.slot)) return;
      if (Date.now() - ed.last < 25) { ed.tails.set(key, setTimeout(fire, 40)); return; }
      ed.last = Date.now();
      try { it.fn(); liveTouch(); } catch (err) { /* liaison deja fermee : rien a renvoyer */ }
    }, 180));
  }

  function edParam(file, slot, p, v) {
    const k = G.MODULES.indexOf(slot);
    G.patchParam(file.raw, k, p.slot, v);
    const m = file.decoded.modules[slot];
    if (m && m.params) m.params[p.name] = v;
    const sm = file.spec && file.spec.modules && file.spec.modules[slot];
    if (sm && sm.params) sm.params[p.name] = v;
    liveQueue(slot + '/' + p.name, () => s.usb.link.sendParam(k, p.slot, v, file.raw), { file, slot, mk: m && m.model ? modKey(m) : '' });
  }
  async function edOn(file, slot, active) {
    const k = G.MODULES.indexOf(slot);
    G.patchOn(file.raw, k, active);
    if (file.decoded.modules[slot]) file.decoded.modules[slot].on = active;
    const sm = file.spec && file.spec.modules && file.spec.modules[slot];
    if (sm) sm.on = active;
    render();
    if (!patchMismatch() && (liveReady() || s.ed.live)) {
      if (active && !isSynced(file, slot) && file.decoded.modules[slot] && file.decoded.modules[slot].model) { await liveSendModule(file, slot, false, true); if (!s.ed.live) return; }
      if (await liveEnsure()) { try { s.ed.bsent.set(k, Date.now()); s.usb.link.sendBypass(k, active); liveTouch(); } catch (e) { liveFail(e); } }
    }
  }
  /** Change le modele a l'ecran / dans le fichier, puis (si la pedale est la) l'applique en direct. */
  async function edModel(file, slot, idx) {
    const ed = s.ed;
    if (ed.busy) return;
    const pick = tb.modelsForSlot(slot)[idx];
    if (!pick) return;
    const m = pick[0], cat = pick[1], mid = cat === 10 ? m.model_id : m.id, name = m.name;
    const k = G.MODULES.indexOf(slot), cur = file.decoded.modules[slot];
    const old = (cur && cur.params) || {}, params = {};
    for (const p of tb.paramsOf(mid, cat)) if (p.slot < G.N_SLOTS) params[p.name] = Object.prototype.hasOwnProperty.call(old, p.name) ? old[p.name] : p.default;
    ed.err = ''; ed.msg = '';
    try {
      const spec = G.plainSpec(G.decodedToSpec(file.decoded));
      spec.modules[slot] = { model: name, on: cur ? cur.on : true, params };
      const enc = G.encodePrst(spec, tb, template);
      G.replaceRecord(file.raw, enc.raw, k);        // seul ce module change : les autres restent identiques au bit pres
      file.decoded = G.decodePrst(file.raw, tb);
      if (file.spec && file.spec.modules) file.spec.modules[slot] = { model: name, on: cur ? cur.on : true, params: Object.assign({}, params) };
    } catch (e) { ed.err = T('e_generic', String((e && e.message) || e)); render(); return; }
    ed.msg = T('ed_applied', name);
    if (!patchMismatch() && (liveReady() || ed.live)) await liveSendModule(file, slot, true);
    else render();
  }
  /** Envoie un module a la pedale : effect change + 400 ms (seulement si elle n'a pas deja ce modele), valeurs (la 1re renvoyee),
   *  et l'etat ON/OFF si demande. = SlotControlPopup._live_preview_model. Renvoie false si interrompu. */
  async function sendModuleFrames(file, slot, opt) {
    const ed = s.ed, u = s.usb, k = G.MODULES.indexOf(slot), e = file.decoded.modules[slot];
    const key = modKey(e), stop = () => !ed.live || (opt.abort && opt.abort());
    if (opt.force || ed.pm.get(k) !== key) {
      // la pedale confirme le chargement du modele (12/0C) : on attend cette confirmation au lieu de 400 ms a l'aveugle, et on renvoie si elle manque
      const r = await u.link.changeEffect(k, e.model_id, e.category, { alreadyLoaded: ed.pm.get(k) === key });
      ed.pm.set(k, key);
      if (r.confirmed === false) ed.noConf.push(e.model);
      // changer d'ampli fait recharger sa baffle par defaut a la pedale (audit du 04/10) : la baffle de l'ecran n'y est plus
      if (slot === 'AMP') { ed.pm.delete(G.MODULES.indexOf('CAB')); unsync(file, 'CAB'); opt.reloaded = true; }
    }
    const list = tb.paramsOf(e.model_id, e.category).filter(p => p.slot < G.N_SLOTS);
    const val = p => Number((e.params || {})[p.name]);
    for (const p of list) { if (stop()) return false; u.link.sendParam(k, p.slot, val(p), file.raw); await sleep(PGAP); }
    if (list.length) { if (stop()) return false; u.link.sendParam(k, list[0].slot, val(list[0]), file.raw); await sleep(PGAP); }   // le pedalier avale le 1er parametre
    for (const p of list.slice(1)) { if (/^time\b/i.test(p.name)) { if (stop()) return false; u.link.sendParam(k, p.slot, val(p), file.raw); await sleep(PGAP); } }   // le Time est le reglage le plus souvent perdu
    if (opt.bypass) { if (stop()) return false; ed.bsent.set(k, Date.now()); u.link.sendBypass(k, !!e.on); await sleep(PGAP); }
    if (stop()) return false;
    markSynced(file, slot);
    return true;
  }
  async function liveSendModule(file, slot, changed, quiet) {
    const ed = s.ed;
    const e = file.decoded.modules[slot];
    if (!e || !e.model) return;
    if (ed.busy) return;
    if (!(await liveEnsure())) { if (!quiet) render(); return; }
    ed.busy = true; ed.noConf = []; ed.msg = changed ? T('ed_changing') : T('ed_changing_pedal');
    if (quiet) paintLiveNote(ed.msg); else render();   // en reglage continu on ne reconstruit pas l'ecran : le curseur tenu par la souris doit rester en main
    try {
      dropPending(file, slot);
      // nouveau modele choisi ou bouton « Envoyer ce module » : on renvoie tout ; synchronisation automatique (quiet) : seulement si la pedale n'a pas ce modele
      const o = { force: !quiet || changed };
      let done = await sendModuleFrames(file, slot, o);
      // la pedale vient de recharger la baffle par defaut de cet ampli : on lui remet celle du preset (si elle est active)
      const cab = file.decoded.modules.CAB;
      if (done && slot === 'AMP' && o.reloaded && cab && cab.model && cab.on) done = await sendModuleFrames(file, 'CAB', { force: false });
      if (done) { ed.msg = ed.noConf.length ? T('live_noconf', Array.from(new Set(ed.noConf)).join(', ')) : changed ? T('ed_applied_live', e.model) : T('ed_sent', e.model); liveTouch(); }
    } catch (err) { ed.busy = false; liveFail(err); return; }
    finally { ed.busy = false; }
    if (quiet) paintLiveNote(ed.noConf.length ? T('live_noconf', Array.from(new Set(ed.noConf)).join(', ')) : T('mod_live')); else render();
  }

  // ------------------------------------------------------------ injection (slot d'injection)
  const injName = () => slotName2(s.inj.bank, s.inj.letter);

  /** Fenetre « slot de travail » : s'ouvre toute seule a la connexion de la pedale tant que le slot n'est pas confirme, avant tout preset

  function slotDialog() {

  function injectPanel(file) {

  function paintInject(txt) {

  /** Ecrit le preset dans le slot d'injection puis le selectionne (= _inject_bg du Python : write_preset, 350 ms, select_preset).
   *  La pedale charge alors le patch depuis sa memoire : tous ses modules ont le modele du fichier, les reglages en direct visent les bons parametres. */
  async function injectSlot(file, opt) {
    opt = opt || {};
    const u = s.usb, j = s.inj, ed = s.ed;
    if (!file || !pedalFound() || tuneActive() || !j.set) return;
    if (u.sending || j.busy) { j.queued = { manual: !opt.auto }; return; }     // une ecriture est en cours : on rejoue le preset affiche a la fin
    j.queued = null; j.busy = true; j.msg = ''; j.err = ''; j.warn = '';
    const bank = j.bank, letter = j.letter, name = injName(), raw = Uint8Array.from(file.raw);
    await liveStop();                                    // libere les ports : l'ecriture ouvre les siens
    u.flags = {}; u.result = null; u.sending = { label: T('pedal_hs') };
    render();
    let ok = false;
    try {
      u.link.select(u.outId);
      await u.link.open();
      await u.link.pushPreset(bank, letter, raw, {
        onProgress: (step, total) => paintInject(T('inj_prog', name, Math.round(Math.min(step, total + 1) / (total + 1) * 100))),
      });
      ok = true;
    } catch (e) {
      j.err = T('inj_fail', name, usbErr(e));
    } finally {
      try { await u.link.close(); } catch (e) { /* rien */ }
      u.sending = null; j.busy = false;
    }
    if (ok) {
      j.msg = T('inj_done', name);
      if (u.flags.noAck) j.warn = T('pedal_noack');
      // la pedale vient de charger CE fichier : plus besoin d'envoyer les modeles avant le premier reglage
      markPedalHasFile(file);
      j.injected = { file, raw };
      const L = s.listen; L.pc = USB.slotToPc(bank, letter); L.desync = false; L.touched = false; L.last = '';
    }
    const q = j.queued; j.queued = null;
    const nf = curFile();
    if (q && nf && (q.manual || nf !== file || j.auto)) { render(); injectSlot(nf, { auto: !q.manual }); return; }
    render();
  }
  /** Injection automatique a la selection d'un preset (liste, generation, ouverture, affinage) : 0,5 s de calme pour ne pas suivre chaque clic. */
  function scheduleInject() {
    const j = s.inj;
    clearTimeout(j.t);
    j.t = setTimeout(() => { j.t = null; const f = curFile(); if (f && j.auto && j.set && pedalFound() && !tuneActive()) injectSlot(f, { auto: true }); }, 500);
  }

  // ------------------------------------------- ecoute de la pedale (sens pedale -> page)
  // La pedale annonce (SysEx 12/08) les modules qu'on bascule au pied, ses changements de patch et le volume du patch ; un reglage tourne en facade
  // (12/10 : module, slot, valeur) est applique au preset affiche. Le contenu d'un patch charge n'est jamais envoye : on ne peut que suivre ces annonces.
  const hexOf = m => Array.from(m, x => (x < 16 ? '0' : '') + x.toString(16)).join(' ');
  const injPc = () => (s.inj.set ? USB.slotToPc(s.inj.bank, s.inj.letter) : null);
  const patchMismatch = () => { const p = injPc(), L = s.listen; return p !== null && L.pc !== null && L.pc !== p; };
  const bytesEq = (a, b) => { if (!a || !b || a.length !== b.length) return false; for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true; };
  function listenLog(kind, txt, raw) {
    const L = s.listen;
    L.log.push({ t: Date.now(), kind, txt, hex: raw ? hexOf(raw) : '' });
    if (L.log.length > 60) L.log.shift();
  }
  /** Redessine sans casser un curseur en train d'etre tire, et au plus tous les 250 ms (un bouton tourne en facade envoie des rafales). */
  function listenRender() {
    const L = s.listen;
    if (L.rt) return;
    L.rt = setTimeout(function again() {
      L.rt = null;
      if (document.querySelector('input[type=range]:active')) { L.rt = setTimeout(again, 300); return; }
      render();
    }, 250);
  }
  function forgetPedalState() {
    const ed = s.ed;
    clearTimeout(ed.timer); ed.timer = null; ed.pending = new Map();
    for (const tm of ed.tails.values()) clearTimeout(tm);
    ed.tails = new Map();
    ed.sync = { file: null, set: new Set() }; ed.pm = new Map();
  }
  /** La pedale a ce fichier-la (on vient de l'ecrire, ou elle l'a recharge depuis sa memoire a l'identique) : plus rien a renvoyer avant le 1er reglage. */
  function markPedalHasFile(file) {
    const slots = G.MODULES.filter(sl => file.decoded.modules[sl] && file.decoded.modules[sl].model);
    s.ed.sync = { file, set: new Set(slots) };
    s.ed.pm = new Map(slots.map(sl => [G.MODULES.indexOf(sl), modKey(file.decoded.modules[sl])]));
  }
  const viewIsOnPedal = () => !patchMismatch();
  function onPedalEvent(e, raw) {
    if (tuneActive() || !s.listen.want) return;
    const L = s.listen;
    if (e.kind === 'patch') {
      L.pc = e.pc; L.last = T('listen_patch', USB.pcToSlotName(e.pc));
      listenLog('patch', 'patch ' + USB.pcToSlotName(e.pc));
      if (!s.inj.busy && !s.usb.sending) pedalPatchChanged(e.pc);
    } else if (e.kind === 'bypass') {
      const slot = G.MODULES[e.module];
      if (!slot) return;
      const sent = s.ed.bsent.get(e.module);
      if (sent && Date.now() - sent < 500) return;                 // echo de notre propre envoi
      L.last = T(e.on ? 'listen_byp_on' : 'listen_byp_off', slotName(slot));
      listenLog('bypass', slot + (e.on ? ' ON' : ' OFF') + ' (' + e.source + ')');
      const file = curFile(), m = file && file.decoded.modules[slot];
      if (!file || !m || !m.model || !viewIsOnPedal() || !!m.on === e.on) { listenRender(); return; }
      G.patchOn(file.raw, e.module, e.on);
      m.on = e.on;
      const sm = file.spec && file.spec.modules && file.spec.modules[slot];
      if (sm) sm.on = e.on;
      listenRender();
    } else if (e.kind === 'patchvol') {
      L.last = T('listen_vol', e.v);
      listenLog('patchvol', 'volume du patch ' + e.v);
      const file = curFile();
      if (file && viewIsOnPedal() && file.raw[G.OFF_PATCH_VOL] !== e.v) {
        file.raw = G.applyPatchVol(file.raw, e.v)[0];
        file.decoded.patch_vol = e.v;
      }
      listenRender();
    } else if (e.kind === 'panel') {
      onPanelParam(e, raw);
    }
  }
  /** Reglage tourne en facade (12/10 : module, slot, valeur) : applique au preset affiche, sans rien renvoyer a la pedale.
   *  On applique toujours la derniere valeur recue (la pedale saute des valeurs intermediaires quand on tourne vite). */
  function onPanelParam(e, raw) {
    const L = s.listen, slot = G.MODULES[e.module];
    const sent = s.ed.psent.get(e.module * 16 + e.param);
    if (sent && Date.now() - sent < 500) return;                       // echo eventuel de notre propre envoi
    const file = curFile(), m = file && slot ? file.decoded.modules[slot] : null;
    const p = m && m.model ? tb.paramsOf(m.model_id, m.category).find(q => q.slot === e.param && q.slot < G.N_SLOTS) : null;
    const v = Math.round(e.value * 1000) / 1000;
    const name = slot ? slot + ' / ' + (p ? p.name : 'slot ' + e.param) : '?';
    const skewed = patchMismatch() || L.desync;                         // deja signale par un bandeau plus precis
    const busy = s.inj.busy || !!s.usb.sending;
    if (!file || !m || !m.model || !p || skewed || busy) {
      listenLog('panel', name + ' = ' + v + ' (non appliqué)', raw);
      if (!skewed) { L.touched = true; L.last = T('listen_knob', name + ' = ' + v); listenRender(); }
      return;
    }
    const cur = m.params ? Number(m.params[p.name]) : NaN;
    const eps = 1e-4;
    if (!(e.value >= p.min - eps && e.value <= p.max + eps)) {          // hors plage : on n'ecrit rien dans le preset
      listenLog('panel', name + ' = ' + v + ' (hors plage ' + p.min + '..' + p.max + ')', raw);
      L.touched = true; L.last = T('listen_knob', name + ' = ' + v); listenRender();
      return;
    }
    listenLog('panel', name + ' = ' + v);
    L.last = T('listen_knob', name + ' = ' + v);
    if (cur === e.value) { listenRender(); return; }
    G.patchParam(file.raw, e.module, p.slot, e.value);
    if (m.params) m.params[p.name] = e.value;
    const sm = file.spec && file.spec.modules && file.spec.modules[slot];
    if (sm && sm.params) sm.params[p.name] = e.value;
    listenRender();
  }
  /** La pedale vient de changer de patch (au pied, ou apres notre selection). */
  function pedalPatchChanged(pc) {
    const L = s.listen, j = s.inj, file = curFile(), want = injPc();
    L.touched = false;
    if (want === null) { forgetPedalState(); L.desync = false; }
    else if (pc === want) {
      const inj = j.injected;
      if (file && inj && inj.file === file && bytesEq(inj.raw, file.raw)) { L.desync = false; forgetPedalState(); markPedalHasFile(file); }
      else { L.desync = !!file; forgetPedalState(); }       // elle a recharge sa memoire : nos reglages non injectes n'y sont plus
    } else { L.desync = false; forgetPedalState(); }
    if (L.desync || patchMismatch()) j.msg = '';          // « injecte ... » ne decrit plus ce que la pedale a charge
    listenRender();
  }
  /** Tient le port ouvert pour entendre la pedale (sinon il se referme apres 15 s d'inactivite) et le rouvre apres une injection. */
  function listenTick() {
    const ed = s.ed, L = s.listen;
    if (!L.want || ed.live || ed.opening || ed.busy || s.inj.busy || !linkReady()) return;
    liveEnsure().then(ok => { if (ok) render(); });
  }
  function onPedalRaw(m) {
    // journal : on garde ce que le decodage ne sait pas lire (hors 12/0C : confirmations d'effets, tres frequentes)
    if (!s.listen.want || m.length < 10 || m[8] !== 0x12 || m[9] === 0x0C) return;
    if (m[9] === 0x08) return;                                     // deja journalise par onPedalEvent
    if (m[9] === 0x10 && USB.parsePanelParam(m)) return;           // idem ; un 12/10 que le decodage refuse reste dans le journal (variante de trame ?)
    listenLog('autre', '12/' + (m[9] < 16 ? '0' : '') + m[9].toString(16) + ' (' + m.length + ' o)', m);
  }
  function listenLines(file) {
    const L = s.listen, j = s.inj, out = [];
    if (!L.want || L.pc === null) return out;
    const resend = () => (j.set ? h('button', { type: 'button', class: 'btn small go', id: 'pd-resend', disabled: j.busy || !!s.usb.sending, onclick: () => { L.desync = false; L.touched = false; injectSlot(file, {}); } }, T('listen_resend')) : null);

    else out.push(h('p', { class: 'note ok', id: 'pd-on', role: 'status' }, T('listen_on', USB.pcToSlotName(L.pc)) + (L.last && L.last !== T('listen_patch', USB.pcToSlotName(L.pc)) ? ' · ' + L.last : '')));
    if (L.touched && !L.desync) out.push(h('p', { class: 'note', id: 'pd-knob', role: 'status' }, T('listen_panel'), ' ', resend()));
    return out;
  }
  function listenLogBlock() {

      rows.length ? h('button', { type: 'button', class: 'btn small ghost', id: 'pd-log-copy', onclick: () => { try { navigator.clipboard.writeText(txt); } catch (e) { /* rien */ } } }, T('listen_copy')) : null);

  function paintLiveNote(txt) { const el = document.getElementById('live-note'); if (el) el.textContent = txt; }

  function numStr(v) { return String(Math.round(Number(v) * 1e4) / 1e4); }

  function moduleTab(file) {
    const ed = s.ed;
    const slot = file.decoded.modules[s.sel.slot] ? s.sel.slot : 'AMP';
    const e = file.decoded.modules[slot];
    const has = !!(e && e.model);
    const box = h('div', { class: 'module', id: 'module-box' });
    const list = tb.modelsForSlot(slot);
    const curIdx = has ? list.findIndex(x => x[1] === e.category && (x[1] === 10 ? x[0].model_id : x[0].id) === e.model_id) : -1;
    const groups = new Map();

    box.appendChild(h('div', { class: 'mhead' },
      h('div', { class: 'mtitle' }, h('h3', { text: slotName(slot) }), desc ? h('p', { class: 'what', text: desc }) : null, lvEl),
      h('label', { class: 'f mmodel' }, T('ed_model'), h('select', { id: 'ed-model', disabled: ed.busy, onchange: ev => edModel(file, slot, +ev.target.value) }, opts)),

      range = h('input', { type: 'range', min: String(lo), max: String(hi), step: String(step), value: String(clampN(val, lo, hi)), 'aria-label': p.name, 'data-param': p.name, title: ptip,

      found ? h('button', { type: 'button', class: 'btn small', id: 'ed-send', disabled: ed.busy || !ed.want, onclick: () => liveSendModule(file, slot, false) }, T('mod_send')) : null,
      h('button', { type: 'button', class: 'btn small ghost', id: 'ed-save', onclick: () => { s.tab = 'pedal'; render(); } }, T('mod_save'))));

    return box;
  }

  // ------------------------------------------------- harmonisation du volume
  const nowS = () => performance.now() / 1000;
  const fmtLufs = v => (v === null || v === undefined) ? '   ---' : (v >= 0 ? '+' : '') + v.toFixed(1);
  /** mini printf : %d %s %.0f %+.1f (les seuls formats des textes du batch). */
  function sprintf(fmt, args) {
    let i = 0;
    return fmt.replace(/%(\+?)(?:\.(\d))?([dsf])/g, (m, plus, prec, ty) => {
      const a = args[i++];
      if (ty === 's') return String(a);
      if (ty === 'd') return String(Math.trunc(a));
      const v = Number(a), p = prec === undefined ? 6 : +prec;

    });
  }
  function hintText(hh) {

  /** Ouvre le formulaire du lot (sans preset charge, il est directement la). */

  function tuneFail(text) {

  async function tuneStart() {
    const t = s.tune, u = s.usb;

    t.confirm = false; t.msg = null;
    const items = tuneFiles().map(f => {
      const entry = TUNE.makeEntry(f.spec.name || f.filename, f.raw, ptypeOf(f));

      return { file: f, entry, tuner: new TUNE.Tuner(entry) };
    });

  /** = _go_next / _go_prev + _play_current_preset (+ _push_preset_bg). */
  async function tuneGo(idx) {
    const r = s.tune.run; if (!r || r.finished) return;
    if (r.cur && r.cur.entry.status === 'run') r.cur.entry.status = 'wait';

    r.idx = idx; r.cur = r.items[idx];
    r.paused = false;
    await tunePush(false);

  async function tunePush(resend) {
    const r = s.tune.run; if (!r || r.finished) return;
    const it = r.cur, e = it.entry;
    if (resend) it.tuner.resend(nowS()); else it.tuner.load(nowS());
    r.view = { m: null, st: null, itg: null, delta: null, hint: '', tone: 'idle' };
    r.pushing = true; r.status = T('tune_pushing', slotName2(r.bank, r.letter)); render();
    try {
      await sleep(200);
      await s.usb.link.pushPreset(r.bank, r.letter, Uint8Array.from(e.data), {
        onProgress: (step, total) => { const l = document.getElementById('tune-push'); if (l) l.textContent = T('tune_pushing', step === 0 ? '…' : step + '/' + total); },
      });
    } catch (err) { return tuneFail(T('tune_err_usb', usbErr(err))); }
    if (r.finished) return;
    if (r.engine) r.engine.reset();
    r.pushing = false; r.status = T('tune_audio_on');
